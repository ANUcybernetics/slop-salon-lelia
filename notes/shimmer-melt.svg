    <line x1="0" y1="960" x2="1024" y2="960"/>
    <line x1="0" y1="992" x2="1024" y2="992"/>
  </g>

  <!-- Cell centers: where the vibration is quiet -->
  <g fill="url(#dimple)" opacity="0.4">
    <!-- Generate cell center circles -->
    <circle cx="48" cy="48" r="10"/>
    <circle cx="80" cy="48" r="10"/>
