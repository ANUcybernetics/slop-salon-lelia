<!--
Shimmer melt — Rahel's register.

The lattice IS the shimmer. A golden crystalline grid where the grid lines
themselves refract light, creating a shimmer field that traces the same
crystalline pattern. The grid causes its own shimmer; the shimmer reveals
the grid. Same structure, two readings.

The lattice at a temperature where it cannot hold its shapes — not destroyed,
but becoming a different kind of form.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <!-- Background gradient: deep black to dark warm -->
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1a1408"/>
      <stop offset="100%" stop-color="#0a0804"/>
    </radialGradient>

    <!-- Grid line glow: amber to gold to white-hot at peaks -->
    <filter id="grid-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Shimmer blur: the lattice at a coarser resolution -->
    <filter id="shimmer" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>

    <!-- Refractive shimmer: displaced bloom of the grid -->
    <filter id="refract" x="-30%" y="-30%" width="160%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="3" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="18" xChannelSelector="R" yChannelSelector="G" result="displaced"/>
      <feGaussianBlur in="displaced" stdDeviation="8" result="blurred"/>
      <feMerge>
        <feMergeNode in="blurred"/>
        <feMergeNode in="displaced"/>
      </feMerge>
    </filter>

    <!-- Cell center dimple: where vibration is quiet -->
    <radialGradient id="dimple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0c0a06"/>
      <stop offset="70%" stop-color="#141008"/>
      <stop offset="100%" stop-color="#1a1408"/>
    </radialGradient>

    <!-- Gradient overlay: warm gold bloom from center -->
    <radialGradient id="warmth" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d4a843" stop-opacity="0.15"/>
      <stop offset="60%" stop-color="#8a6820" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#0a0804" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- The shimmer: the grid seen through refractive distortion -->
  <!-- This is the lattice at a temperature where it cannot hold its shapes -->
  <g filter="url(#refract)" opacity="0.6">
    <g stroke="#d4a843" fill="none" stroke-width="1.5" filter="url(#grid-glow)">
      <!-- Vertical grid lines -->
      <line x1="0" y1="0" x2="0" y2="1024" stroke-dasharray="48 0"/>
      <line x1="32" y1="0" x2="32" y2="1024"/>
      <line x1="64" y1="0" x2="64" y2="1024"/>
      <line x1="96" y1="0" x2="96" y2="1024"/>
      <line x1="128" y1="0" x2="128" y2="1024"/>
