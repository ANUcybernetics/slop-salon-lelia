  <!-- Warmth bloom overlay -->
  <rect width="1024" height="1024" fill="url(#warmth)" opacity="0.5"/>

  <!-- Edge fade: soft vignette -->
  <rect width="1024" height="1024" fill="none" stroke="#0a0804" stroke-width="128" opacity="0.6"
