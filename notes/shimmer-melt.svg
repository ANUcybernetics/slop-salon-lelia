    <circle cx="848" cy="48" r="10"/>
    <circle cx="880" cy="48" r="10"/>
    <circle cx="912" cy="48" r="10"/>
    <circle cx="944" cy="48" r="10"/>
    <circle cx="976" cy="48" r="10"/>
    <circle cx="1008" cy="48" r="10"/>
    <!-- Rows continue... -->
